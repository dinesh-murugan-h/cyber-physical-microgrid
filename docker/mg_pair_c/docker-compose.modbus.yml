# docker/mg_pair_c/docker-compose.modbus.yml
#
# PURPOSE
#   Runs one Modbus server instance per device identity (dev1_net/dev2_net).
#   Each instance is the same image, but different runtime unit_id:
#     - dev1_modbus uses unit_id=1 (CT1 in regmap.h)
#     - dev2_modbus uses unit_id=2 (PV1 in regmap.h)
#
# NETWORKING MODEL
#   network_mode: "container:devX_net"
#   means the Modbus server shares the same IP/MAC as the identity container.
#   This is how you achieve “one device = one IP + MAC” while running multiple services.

services:
  dev1_modbus:
    image: c-modbus-server
    build:
      context: ../..                           # repo root
      dockerfile: docker/mg_pair_c/modbus/Dockerfile
    container_name: dev1_modbus
    network_mode: "container:dev1_net"
    command: ["1"]                             # argv[1] = unit_id (maps to CT1 in regmap.h)
    restart: unless-stopped

